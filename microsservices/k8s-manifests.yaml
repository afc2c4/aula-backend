apiVersion: v1
kind: Secret
metadata:
  name: microsservices-secrets
type: Opaque
stringData:
  # Usado pelo auth e pelos demais servicos que validam JWT localmente.
  JWT_SECRET: secret_dev_key
  # O catalogo espera um MongoDB externo ou um StatefulSet fora deste arquivo.
  MONGO_URI: mongodb://catalogo-mongo:27017/catalogo_db
  MONGO_DB_NAME: catalogo_db
  # O pedidos espera um MySQL externo ou um StatefulSet fora deste arquivo.
  MYSQL_HOST: pedidos-mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: pedidos_user
  MYSQL_PASSWORD: pedidos_pass
  MYSQL_DATABASE: pedidos_db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: carrinho-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# ===============================================
# 1. MICROSSERVICO: AUTH
# ===============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: microsservices-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: NodePort
  selector:
    app: auth
  ports:
    - name: http
      port: 3003
      targetPort: 3003
      nodePort: 30033
---
# ===============================================
# 2. MICROSSERVICO: CATALOGO
# ===============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-deployment
  labels:
    app: catalogo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo
  template:
    metadata:
      labels:
        app: catalogo
    spec:
      containers:
        - name: catalogo
          image: catalogo-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: microsservices-secrets
                  key: MONGO_URI
            - name: MONGO_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: microsservices-secrets
                  key: MONGO_DB_NAME
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: microsservices-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: catalogo-service
spec:
  type: ClusterIP
  selector:
    app: catalogo
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
# ===============================================
# 3. MICROSSERVICO: CARRINHO
# ===============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carrinho-deployment
  labels:
    app: carrinho
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carrinho
  template:
    metadata:
      labels:
        app: carrinho
    spec:
      containers:
        - name: carrinho
          image: carrinho-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: microsservices-secrets
                  key: JWT_SECRET
            - name: SQLITE_PATH
              value: /data/carrinho.db
          volumeMounts:
            - name: carrinho-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: carrinho-data
          persistentVolumeClaim:
            claimName: carrinho-data
---
apiVersion: v1
kind: Service
metadata:
  name: carrinho-service
spec:
  type: ClusterIP
  selector:
    app: carrinho
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
