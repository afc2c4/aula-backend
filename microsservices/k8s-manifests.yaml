apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-config
data:
  AUTH_SERVICE_URL: "http://auth-service:3000"
  CATALOGO_SERVICE_URL: "http://catalogo-service:3001"
  CARRINHO_SERVICE_URL: "http://carrinho-service:3002"
---
apiVersion: v1
kind: Secret
metadata:
  name: microservices-secret
type: Opaque
stringData:
  JWT_SECRET: "chave_super_secreta_k8s_demonstracao"
---
# ------------------ AUTH SERVICE ------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth
        image: meu-registry/auth-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: microservices-config
        - secretRef:
            name: microservices-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - port: 3000
    targetPort: 3000
---
# ------------------ PEDIDOS SERVICE ------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedidos-service
  template:
    metadata:
      labels:
        app: pedidos-service
    spec:
      containers:
      - name: pedidos
        image: meu-registry/pedidos-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3003
        envFrom:
        - configMapRef:
            name: microservices-config
        - secretRef:
            name: microservices-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos-service
spec:
  type: ClusterIP
  selector:
    app: pedidos-service
  ports:
  - port: 3003
    targetPort: 3003